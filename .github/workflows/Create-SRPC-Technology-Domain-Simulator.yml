name: Create SRPC Technology Domain Simulator

on:
  workflow_dispatch:
    inputs:
      domain_name:
        description: "Technology or company domain name"
        required: true
        type: string

      domain_id:
        description: "Domain ID using lowercase letters, numbers and hyphens"
        required: true
        type: string

      confirm_create:
        description: "Manual lever — confirm domain creation"
        required: true
        default: false
        type: boolean

jobs:
  create-domain:
    if: ${{ inputs.confirm_create == true }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify protected SRPC foundation
        shell: bash
        run: |
          set -e

          echo "Checking protected SRPC foundation..."

          for FILE in \
            research/srpc/srpcKernel.js \
            research/srpc/srpcRules.js \
            research/srpc/srpcCompute.js \
            research/srpc/srpcTest.html
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Protected file missing: $FILE"
              exit 1
            fi

            echo "FOUND: $FILE"
          done

          echo "Protected SRPC foundation verified."

      - name: Validate domain ID
        shell: bash
        run: |
          set -e

          DOMAIN_ID="${{ inputs.domain_id }}"

          if [[ ! "$DOMAIN_ID" =~ ^[a-z0-9-]+$ ]]; then
            echo "ERROR: Invalid domain ID."
            echo "Use lowercase letters, numbers and hyphens only."
            exit 1
          fi

          echo "Domain ID: $DOMAIN_ID"

      - name: Set domain directory
        shell: bash
        run: |
          set -e

          DOMAIN_DIR="research/srpc/domain/${{ inputs.domain_id }}"

          echo "Domain directory: $DOMAIN_DIR"

          if [ -d "$DOMAIN_DIR" ]; then
            echo "ERROR: Domain already exists:"
            echo "$DOMAIN_DIR"
            exit 1
          fi

          mkdir -p "$DOMAIN_DIR"

      - name: Create ScenarioData.js
        shell: bash
        run: |
          set -e

          DOMAIN_DIR="research/srpc/domain/${{ inputs.domain_id }}"

          cat > "$DOMAIN_DIR/ScenarioData.js" <<EOF
/*
 * Sextant Protocol™
 * SRPC Technology Domain Scenario Data
 */

(function (global) {

  const ScenarioData = {

    version: "0.1.0-RESEARCH",

    domain: "${{ inputs.domain_id }}",

    domainName: "${{ inputs.domain_name }}",

    source: "LOCAL_SIMULATION",

    purpose: "SRPC_TECHNOLOGY_DOMAIN_RESEARCH",

    systemState: {
      status: "INITIALIZED",
      resilienceScore: 0
    },

    getData: function () {
      return this;
    },

    getInputs: function () {
      return {
        systemState: this.systemState
      };
    }

  };

  global.SextantScenarioData = ScenarioData;

})(window);
EOF

      - name: Create Rules.js
        shell: bash
        run: |
          set -e

          DOMAIN_DIR="research/srpc/domain/${{ inputs.domain_id }}"

          cat > "$DOMAIN_DIR/Rules.js" <<EOF
/*
 * Sextant Protocol™
 * SRPC Technology Domain Rules
 *
 * Domain rules remain separate from
 * the protected SRPC foundation.
 */

(function (global) {

  const ScenarioRules = {

    version: "0.1.0-RESEARCH",

    domain: "${{ inputs.domain_id }}",

    domainName: "${{ inputs.domain_name }}",

    evaluate: function (systemState) {

      if (
        !systemState ||
        typeof systemState !== "object"
      ) {
        return {
          passed: false,
          result: "SYSTEM_STATE_INVALID"
        };
      }

      return {
        passed: true,
        result: "DOMAIN_INPUT_VALID"
      };
    }

  };

  global.SextantScenarioRules = ScenarioRules;

})(window);
EOF

      - name: Create ScenarioCompute.js
        shell: bash
        run: |
          set -e

          DOMAIN_DIR="research/srpc/domain/${{ inputs.domain_id }}"

          cat > "$DOMAIN_DIR/ScenarioCompute.js" <<'EOF'
/*
 * Sextant Protocol™
 * SRPC Technology Domain Scenario Compute Adapter
 *
 * DATA → ALGORITHMS → COMPUTE
 *
 * This adapter uses the protected SRPC Compute layer.
 */

(function (global) {

  const VERSION = "0.1.0-RESEARCH";

  function validateDependencies() {

    const computeAvailable =
      typeof global.SRPCCompute !== "undefined";

    const kernelAvailable =
      typeof global.SRPCKernel !== "undefined";

    const rulesAvailable =
      typeof global.SRPCRules !== "undefined";

    return {
      valid:
        computeAvailable &&
        kernelAvailable &&
        rulesAvailable,

      srpcComputeAvailable:
        computeAvailable,

      srpcKernelAvailable:
        kernelAvailable,

      srpcRulesAvailable:
        rulesAvailable
    };
  }

  function execute(input) {

    const dependencies =
      validateDependencies();

    if (!dependencies.valid) {

      return {
        scenarioComputeVersion: VERSION,
        executed: false,
        deterministic: false,
        dependencies: dependencies,
        output: null,
        error:
          "Protected SRPC Compute dependencies are unavailable.",
        physicalExecution: false,
        backendConnection: false,
        externalConnection: false,
        autonomousActuation: false,
        humanAuthorizationRequired: true
      };
    }

    const result =
      global.SRPCCompute.execute(input);

    return {
      scenarioComputeVersion: VERSION,
      executed: result.executed,
      deterministic: result.deterministic,
      computeVersion: result.computeVersion,
      kernelVersion: result.kernelVersion,
      kernelOutput: result.kernelOutput,
      error: result.error || null,
      dependencies: dependencies,
      physicalExecution: false,
      backendConnection: false,
      externalConnection: false,
      autonomousActuation: false,
      humanAuthorizationRequired: true
    };
  }

  function testDeterminism(input) {

    const dependencies =
      validateDependencies();

    if (!dependencies.valid) {

      return {
        scenarioComputeVersion: VERSION,
        deterministic: false,
        status:
          "SCENARIO_COMPUTE_DEPENDENCY_FAILURE",
        dependencies: dependencies,
        physicalExecution: false,
        backendConnection: false,
        externalConnection: false,
        autonomousActuation: false,
        humanAuthorizationRequired: true
      };
    }

    const result =
      global.SRPCCompute.testDeterminism(input);

    return {
      scenarioComputeVersion: VERSION,
      deterministic: result.deterministic,
      status:
        result.deterministic
          ? "SCENARIO_COMPUTE_DETERMINISM_PASS"
          : "SCENARIO_COMPUTE_DETERMINISM_FAIL",
      computeVersion: result.computeVersion,
      firstOutput: result.firstOutput,
      secondOutput: result.secondOutput,
      dependencies: dependencies,
      physicalExecution: false,
      backendConnection: false,
      externalConnection: false,
      autonomousActuation: false,
      humanAuthorizationRequired: true
    };
  }

  function getStatus() {

    const dependencies =
      validateDependencies();

    return {
      scenarioComputeVersion: VERSION,
      ready: dependencies.valid,
      dependencies: dependencies,
      physicalExecution: false,
      backendConnection: false,
      externalConnection: false,
      autonomousActuation: false,
      humanAuthorizationRequired: true
    };
  }

  global.SextantScenarioCompute = {

    version: VERSION,

    validateDependencies: validateDependencies,

    execute: execute,

    testDeterminism: testDeterminism,

    getStatus: getStatus

  };

})(window);
EOF

      - name: Create ScenarioTest.html
        shell: bash
        run: |
          set -e

          DOMAIN_DIR="research/srpc/domain/${{ inputs.domain_id }}"

          cat > "$DOMAIN_DIR/ScenarioTest.html" <<EOF
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    SRPC Domain Test — ${{ inputs.domain_name }}
  </title>

</head>

<body>

  <h1>
    Sextant Protocol™ SRPC Technology Domain Simulator
  </h1>

  <h2>${{ inputs.domain_name }}</h2>

  <pre id="output">Running...</pre>

  <script src="../../srpcKernel.js"></script>
  <script src="../../srpcRules.js"></script>
  <script src="../../srpcCompute.js"></script>

  <script src="./ScenarioData.js"></script>
  <script src="./Rules.js"></script>
  <script src="./ScenarioCompute.js"></script>

  <script>

    const data =
      window.SextantScenarioData;

    const input = {

      source:
        data.source,

      purpose:
        data.purpose,

      timestamp:
        "STATIC_TEST_TIMESTAMP",

      systemState: {
        ...data.systemState
      }

    };

    const result =
      window.SextantScenarioCompute
        .execute(input);

    document.getElementById("output")
      .textContent =
        JSON.stringify(
          result,
          null,
          2
        );

  </script>

</body>

</html>
EOF

      - name: Verify generated files
        shell: bash
        run: |
          set -e

          DOMAIN_DIR="research/srpc/domain/${{ inputs.domain_id }}"

          for FILE in \
            "$DOMAIN_DIR/ScenarioData.js" \
            "$DOMAIN_DIR/Rules.js" \
            "$DOMAIN_DIR/ScenarioCompute.js" \
            "$DOMAIN_DIR/ScenarioTest.html"
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing generated file: $FILE"
              exit 1
            fi

            echo "VERIFIED: $FILE"
          done

          echo "All generated files verified."

      - name: Verify protected foundation unchanged
        shell: bash
        run: |
          set -e

          git diff --exit-code -- \
            research/srpc/srpcKernel.js \
            research/srpc/srpcRules.js \
            research/srpc/srpcCompute.js \
            research/srpc/srpcTest.html

          echo "Protected SRPC foundation unchanged."

      - name: Create factory branch
        shell: bash
        run: |
          set -e

          BRANCH="factory/${{ inputs.domain_id }}"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          git add \
            "research/srpc/domain/${{ inputs.domain_id }}"

          git commit \
            -m "Factory: create SRPC domain ${{ inputs.domain_id }}"

          git push origin "$BRANCH"

          echo "Factory branch created: $BRANCH"