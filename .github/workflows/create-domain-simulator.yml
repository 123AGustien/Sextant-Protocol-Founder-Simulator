name: Create SRPC Technology Domain Simulator

on:
  workflow_dispatch:
    inputs:
      domain_name:
        description: "Technology or company domain name"
        required: true
        type: string

      domain_id:
        description: "Domain ID using lowercase letters, numbers and hyphens"
        required: true
        type: string

jobs:
  create-domain:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify protected SRPC foundation
        shell: bash
        run: |
          set -e

          echo "Checking protected SRPC foundation..."

          REQUIRED_FILES=(
            "research/srpc/srpcKernel.js"
            "research/srpc/srpcRules.js"
            "research/srpc/srpcCompute.js"
            "research/srpc/srpcTest.html"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Protected file missing:"
              echo "$FILE"
              exit 1
            fi

            echo "FOUND: $FILE"
          done

          echo "Protected SRPC foundation verified."

      - name: Validate domain ID
        shell: bash
        run: |
          set -e

          DOMAIN_ID="${{ inputs.domain_id }}"

          if [[ ! "$DOMAIN_ID" =~ ^[a-z0-9-]+$ ]]; then
            echo "ERROR: Invalid domain_id."
            echo "Use lowercase letters, numbers and hyphens only."
            exit 1
          fi

          echo "Domain ID validated: $DOMAIN_ID"

      - name: Check domain does not already exist
        shell: bash
        run: |
          set -e

          DOMAIN_DIR="research/srpc/${{ inputs.domain_id }}"

          if [ -d "$DOMAIN_DIR" ]; then
            echo "ERROR: Domain already exists:"
            echo "$DOMAIN_DIR"
            exit 1
          fi

          echo "Domain is available: $DOMAIN_DIR"

      - name: Create domain directory
        shell: bash
        run: |
          set -e

          mkdir -p "research/srpc/${{ inputs.domain_id }}"

      - name: Create ScenarioData.js
        shell: bash
        run: |
          set -e

          cat > "research/srpc/${{ inputs.domain_id }}/ScenarioData.js" <<'EOF'
"use strict"

/*
 * Sextant Protocol™
 * SRPC Technology Domain Scenario Data
 *
 * PURPOSE:
 * Provide deterministic domain-specific research data.
 *
 * SAFETY:
 * - Local research simulation only
 * - No backend connection
 * - No external connection
 * - No physical execution
 * - No autonomous actuation
 * - Human authority remains external
 */

const SRPC_SCENARIO_DATA = {

    domainName: "${{ inputs.domain_name }}",
    domainId: "${{ inputs.domain_id }}",

    source: "LOCAL_SIMULATION",
    purpose: "SRPC_TECHNOLOGY_DOMAIN_RESEARCH",

    systemState: {
        status: "INITIALIZED",
        resilienceScore: 0
    }
};

window.SRPCScenarioData = SRPC_SCENARIO_DATA;
EOF

      - name: Create Rules.js
        shell: bash
        run: |
          set -e

          cat > "research/srpc/${{ inputs.domain_id }}/Rules.js" <<'EOF'
"use strict";

/*
 * Sextant Protocol™
 * SRPC Technology Domain Rules
 *
 * PURPOSE:
 * Provide domain-level rules while preserving
 * the protected SRPC foundation.
 *
 * DOMAIN RULES:
 * Domain rules remain separate from:
 * - SRPCKernel
 * - SRPCRules
 * - SRPCCompute
 */

const SRPC_SCENARIO_RULES = {

    domainName: "${{ inputs.domain_name }}",

    evaluate: function (systemState) {

        if (
            !systemState ||
            typeof systemState !== "object"
        ) {
            return {
                passed: false,
                result: "SYSTEM_STATE_INVALID"
            };
        }

        return {
            passed: true,
            result: "DOMAIN_INPUT_VALID"
        };
    }
};

window.SRPCScenarioRules = SRPC_SCENARIO_RULES;
EOF

      - name: Create ScenarioCompute.js
        shell: bash
        run: |
          set -e

          cat > "research/srpc/${{ inputs.domain_id }}/ScenarioCompute.js" <<'EOF'
"use strict";

/*
 * Sextant Protocol™
 * SRPC Technology Domain Scenario Compute Adapter
 *
 * PURPOSE:
 * Provide the domain-level compute interface while
 * preserving the protected SRPC foundation.
 *
 * ARCHITECTURE:
 *
 * DOMAIN DATA
 *     ↓
 * DOMAIN RULES
 *     ↓
 * SCENARIO COMPUTE ADAPTER
 *     ↓
 * PROTECTED SRPC COMPUTE
 *     ↓
 * SRPC KERNEL + SRPC RULES
 *     ↓
 * DETERMINISTIC RESULT
 *
 * DOCTRINE:
 * DATA → ALGORITHMS → COMPUTE
 *
 * SAFETY:
 * - Protected SRPC foundation remains authoritative.
 * - No replacement of SRPCKernel.
 * - No replacement of SRPCRules.
 * - No replacement of SRPCCompute.
 * - No backend connection.
 * - No external connection.
 * - No physical execution.
 * - No autonomous actuation.
 * - Human authority remains external.
 */

const SEXTANT_SCENARIO_COMPUTE_VERSION =
    "0.1.0-RESEARCH";


/**
 * Validate availability of the protected SRPC layer.
 */
function validateScenarioComputeDependencies() {

    const srpcComputeAvailable =
        typeof window.SRPCCompute !== "undefined";

    const srpcKernelAvailable =
        typeof window.SRPCKernel !== "undefined";

    const srpcRulesAvailable =
        typeof window.SRPCRules !== "undefined";

    return {
        valid:
            srpcComputeAvailable &&
            srpcKernelAvailable &&
            srpcRulesAvailable,

        srpcComputeAvailable:
            srpcComputeAvailable,

        srpcKernelAvailable:
            srpcKernelAvailable,

        srpcRulesAvailable:
            srpcRulesAvailable
    };
}


/**
 * Execute the domain scenario through
 * the protected SRPC Compute layer.
 */
function executeScenarioCompute(input) {

    const dependencies =
        validateScenarioComputeDependencies();

    if (!dependencies.valid) {

        return {
            scenarioComputeVersion:
                SEXTANT_SCENARIO_COMPUTE_VERSION,

            executed: false,

            dependencies:
                dependencies,

            output: null,

            error:
                "Protected SRPC Compute dependencies are unavailable.",

            physicalExecution: false,
            backendConnection: false,
            externalConnection: false,
            autonomousActuation: false,
            humanAuthorizationRequired: true
        };
    }

    const result =
        window.SRPCCompute.execute(input);

    return {

        scenarioComputeVersion:
            SEXTANT_SCENARIO_COMPUTE_VERSION,

        executed:
            result.executed,

        deterministic:
            result.deterministic,

        computeVersion:
            result.computeVersion,

        kernelVersion:
            result.kernelVersion,

        kernelOutput:
            result.kernelOutput,

        error:
            result.error || null,

        dependencies:
            dependencies,

        physicalExecution:
            false,

        backendConnection:
            false,

        externalConnection:
            false,

        autonomousActuation:
            false,

        humanAuthorizationRequired:
            true
    };
}


/**
 * Test deterministic behaviour through
 * the protected SRPC Compute layer.
 */
function testScenarioComputeDeterminism(input) {

    const dependencies =
        validateScenarioComputeDependencies();

    if (!dependencies.valid) {

        return {
            scenarioComputeVersion:
                SEXTANT_SCENARIO_COMPUTE_VERSION,

            deterministic: false,

            status:
                "SCENARIO_COMPUTE_DEPENDENCY_FAILURE",

            dependencies:
                dependencies,

            physicalExecution: false,
            backendConnection: false,
            externalConnection: false,
            autonomousActuation: false,
            humanAuthorizationRequired: true
        };
    }

    const result =
        window.SRPCCompute.testDeterminism(input);

    return {

        scenarioComputeVersion:
            SEXTANT_SCENARIO_COMPUTE_VERSION,

        deterministic:
            result.deterministic,

        status:
            result.deterministic
                ? "SCENARIO_COMPUTE_DETERMINISM_PASS"
                : "SCENARIO_COMPUTE_DETERMINISM_FAIL",

        computeVersion:
            result.computeVersion,

        firstOutput:
            result.firstOutput,

        secondOutput:
            result.secondOutput,

        dependencies:
            dependencies,

        physicalExecution:
            false,

        backendConnection:
            false,

        externalConnection:
            false,

        autonomousActuation:
            false,

        humanAuthorizationRequired:
            true
    };
}


/**
 * Return current domain compute status.
 */
function getScenarioComputeStatus() {

    const dependencies =
        validateScenarioComputeDependencies();

    let protectedComputeStatus = null;

    if (
        dependencies.srpcComputeAvailable &&
        typeof window.SRPCCompute.getStatus === "function"
    ) {
        protectedComputeStatus =
            window.SRPCCompute.getStatus();
    }

    return {

        scenarioComputeVersion:
            SEXTANT_SCENARIO_COMPUTE_VERSION,

        ready:
            dependencies.valid,

        dependencies:
            dependencies,

        protectedSRPCCompute:
            protectedComputeStatus,

        physicalExecution:
            false,

        backendConnection:
            false,

        externalConnection:
            false,

        autonomousActuation:
            false,

        humanAuthorizationRequired:
            true
    };
}


/**
 * Public Sextant Protocol™
 * Technology Domain Scenario Compute API.
 */
window.SextantScenarioCompute = {

    version:
        SEXTANT_SCENARIO_COMPUTE_VERSION,

    validateDependencies:
        validateScenarioComputeDependencies,

    execute:
        executeScenarioCompute,

    testDeterminism:
        testScenarioComputeDeterminism,

    getStatus:
        getScenarioComputeStatus
};
EOF

      - name: Create ScenarioTest.html
        shell: bash
        run: |
          set -e

          cat > "research/srpc/${{ inputs.domain_id }}/ScenarioTest.html" <<'EOF'
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SRPC Domain Test — ${{ inputs.domain_name }}
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
            margin: 0;
            padding: 20px;
        }

        .panel {
            background: #1f2937;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #030712;
            padding: 14px;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <h1>SRPC Technology Domain Simulator</h1>

    <div class="panel">

        <h2>${{ inputs.domain_name }}</h2>

        <pre id="output">Running...</pre>

    </div>

    <!-- Protected SRPC foundation -->

    <script src="../srpcKernel.js"></script>
    <script src="../srpcRules.js"></script>
    <script src="../srpcCompute.js"></script>

    <!-- Generated technology-domain layer -->

    <script src="./ScenarioData.js"></script>
    <script src="./Rules.js"></script>
    <script src="./ScenarioCompute.js"></script>

    <script>

        "use strict";

        const input = {

            source:
                SRPCScenarioData.source,

            purpose:
                SRPCScenarioData.purpose,

            timestamp:
                "STATIC_TEST_TIMESTAMP",

            systemState: {
                ...SRPCScenarioData.systemState
            }

        };

        const result =
            window.SextantScenarioCompute
                .execute(input);

        document.getElementById("output")
            .textContent =
                JSON.stringify(
                    result,
                    null,
                    2
                );

    </script>

</body>

</html>
EOF

      - name: Verify generated files
        shell: bash
        run: |
          set -e

          DOMAIN_DIR="research/srpc/${{ inputs.domain_id }}"

          REQUIRED_DOMAIN_FILES=(
            "$DOMAIN_DIR/ScenarioData.js"
            "$DOMAIN_DIR/Rules.js"
            "$DOMAIN_DIR/ScenarioCompute.js"
            "$DOMAIN_DIR/ScenarioTest.html"
          )

          for FILE in "${REQUIRED_DOMAIN_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Generated file missing:"
              echo "$FILE"
              exit 1
            fi

            echo "GENERATED: $FILE"

          done

          echo "All domain files verified."

      - name: Verify protected foundation unchanged
        shell: bash
        run: |
          set -e

          git diff --exit-code -- \
            research/srpc/srpcKernel.js \
            research/srpc/srpcRules.js \
            research/srpc/srpcCompute.js \
            research/srpc/srpcTest.html

          echo "Protected SRPC foundation unchanged."

      - name: Create factory branch
        shell: bash
        run: |
          set -e

          BRANCH="factory/${{ inputs.domain_id }}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          git add \
            "research/srpc/${{ inputs.domain_id }}"

          git commit \
            -m "Factory: create SRPC domain ${{ inputs.domain_id }}"

          git push origin "$BRANCH"

          echo "Factory branch created:"
          echo "$BRANCH"