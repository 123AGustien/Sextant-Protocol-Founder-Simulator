name: Sextant Protocol SRPC Factory Validation

on:
  workflow_dispatch:

  push:
    branches:
      - domain/grid-module-dpa
    paths:
      - "research/srpc/**"
      - "index.html"
      - ".github/workflows/create-domain-simulator.yml"

jobs:
  validate-srpc-factory:
    name: Validate SRPC Factory and Grid Module
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository state
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      # ------------------------------------------------------------
      # PROTECTED SRPC FOUNDATION
      # ------------------------------------------------------------

      - name: Verify protected SRPC foundation
        run: |
          test -f research/srpc/srpcKernel.js
          test -f research/srpc/srpcRules.js
          test -f research/srpc/srpcCompute.js
          test -f research/srpc/srpcTest.html

          echo "Protected SRPC foundation verified."

      # ------------------------------------------------------------
      # TECHNOLOGY DOMAIN ARCHITECTURE
      # ------------------------------------------------------------

      - name: Verify technology domain architecture
        run: |
          test -f research/srpc/domain/ScenarioData.js
          test -f research/srpc/domain/Rules.js
          test -f research/srpc/domain/ScenarioRules.js
          test -f research/srpc/domain/RuleEngine.js
          test -f research/srpc/domain/Scenario.js
          test -f research/srpc/domain/ScenarioRuleEngine.js
          test -f research/srpc/domain/ScenarioEngine.js
          test -f research/srpc/domain/ScenarioCompute.js
          test -f research/srpc/domain/DomainIntegration.js
          test -f research/srpc/domain/Module.js
          test -f research/srpc/domain/ScenarioTest.html

          echo "Technology domain architecture verified."

      # ------------------------------------------------------------
      # GRID MODULE
      # ------------------------------------------------------------

      - name: Verify Grid Module files
        run: |
          GRID_DIR="research/srpc/domain/grid"

          test -f "$GRID_DIR/ScenarioData.js"
          test -f "$GRID_DIR/Rules.js"
          test -f "$GRID_DIR/ScenarioRules.js"
          test -f "$GRID_DIR/RuleEngine.js"
          test -f "$GRID_DIR/Scenario.js"
          test -f "$GRID_DIR/ScenarioRuleEngine.js"
          test -f "$GRID_DIR/ScenarioEngine.js"
          test -f "$GRID_DIR/ScenarioCompute.js"
          test -f "$GRID_DIR/DomainIntegration.js"
          test -f "$GRID_DIR/Module.js"
          test -f "$GRID_DIR/GridSimulatorUI.js"
          test -f "$GRID_DIR/ScenarioTest.html"

          echo "Grid Module architecture verified."

      # ------------------------------------------------------------
      # GRID DPA HANDBOOK
      # ------------------------------------------------------------

      - name: Verify Grid DPA Handbook
        run: |
          HANDBOOK="research/documentation/grid/Sextant_Grid_Module_DPA_Handbook.md"

          test -f "$HANDBOOK"

          echo "Grid DPA Handbook verified."
          echo "Expected SHA-256:"
          echo "44a07262b91bffa2e1626e82ac62e370493a4c21ac6da1c72df991b804b16dda"

      - name: Verify Grid DPA Handbook SHA-256
        run: |
          HANDBOOK="research/documentation/grid/Sextant_Grid_Module_DPA_Handbook.md"

          ACTUAL_SHA=$(sha256sum "$HANDBOOK" | awk '{print $1}')

          EXPECTED_SHA="44a07262b91bffa2e1626e82ac62e370493a4c21ac6da1c72df991b804b16dda"

          echo "Actual SHA-256:"
          echo "$ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Grid DPA Handbook SHA-256 mismatch."
            exit 1
          fi

          echo "Grid DPA Handbook SHA-256 verification PASS."

      # ------------------------------------------------------------
      # ROOT COCKPIT
      # ------------------------------------------------------------

      - name: Verify root cockpit
        run: |
          test -f index.html

          echo "Root SRPC Factory cockpit verified."

      # ------------------------------------------------------------
      # VERIFY GRID SCRIPT REFERENCES
      # ------------------------------------------------------------

      - name: Verify Grid cockpit references
        run: |
          grep -q 'research/srpc/domain/grid/ScenarioData.js' index.html
          grep -q 'research/srpc/domain/grid/Rules.js' index.html
          grep -q 'research/srpc/domain/grid/ScenarioRules.js' index.html
          grep -q 'research/srpc/domain/grid/RuleEngine.js' index.html
          grep -q 'research/srpc/domain/grid/Scenario.js' index.html
          grep -q 'research/srpc/domain/grid/ScenarioRuleEngine.js' index.html
          grep -q 'research/srpc/domain/grid/ScenarioEngine.js' index.html
          grep -q 'research/srpc/domain/grid/ScenarioCompute.js' index.html
          grep -q 'research/srpc/domain/grid/DomainIntegration.js' index.html
          grep -q 'research/srpc/domain/grid/Module.js' index.html
          grep -q 'research/srpc/domain/grid/GridSimulatorUI.js' index.html

          echo "Grid cockpit script references verified."

      # ------------------------------------------------------------
      # VERIFY SAFETY BOUNDARY
      # ------------------------------------------------------------

      - name: Verify safety boundary
        run: |
          grep -q "Physical Execution" index.html
          grep -q "Autonomous Actuation" index.html
          grep -q "Human Decision Authority" index.html

          echo "Safety boundary language verified."

      # ------------------------------------------------------------
      # VERIFY GOLDEN RULE
      # ------------------------------------------------------------

      - name: Verify Golden Rule
        run: |
          grep -q "OBSERVE" index.html
          grep -q "VERIFY" index.html
          grep -q "ASSESS" index.html
          grep -q "DECIDE" index.html
          grep -q "ACT" index.html
          grep -q "UPDATE" index.html

          echo "Golden Rule lifecycle verified."

      # ------------------------------------------------------------
      # VERIFY NO OLD GENERATOR OUTPUT
      # ------------------------------------------------------------

      - name: Verify obsolete generic generator is absent
        run: |
          if grep -R "global.SextantScenarioData" research/srpc/domain/grid; then
            echo "ERROR: Grid Module contains obsolete generic ScenarioData global."
            exit 1
          fi

          if grep -R "global.SextantScenarioRules" research/srpc/domain/grid; then
            echo "ERROR: Grid Module contains obsolete generic ScenarioRules global."
            exit 1
          fi

          if grep -R "global.SextantScenarioCompute" research/srpc/domain/grid; then
            echo "ERROR: Grid Module contains obsolete generic ScenarioCompute global."
            exit 1
          fi

          echo "Grid Module uses dedicated Grid globals."

      # ------------------------------------------------------------
      # PROTECTED FOUNDATION CHANGE CHECK
      # ------------------------------------------------------------

      - name: Verify protected foundation has not been modified
        run: |
          git diff --exit-code -- \
            research/srpc/srpcKernel.js \
            research/srpc/srpcRules.js \
            research/srpc/srpcCompute.js \
            research/srpc/srpcTest.html

          echo "Protected SRPC foundation unchanged."

      # ------------------------------------------------------------
      # FINAL VALIDATION
      # ------------------------------------------------------------

      - name: SRPC Factory validation summary
        run: |
          echo "=============================================="
          echo "SEXTANT PROTOCOL SRPC FACTORY"
          echo "VALIDATION COMPLETE"
          echo "=============================================="
          echo ""
          echo "Protected SRPC foundation: PASS"
          echo "Technology domain architecture: PASS"
          echo "Grid Module architecture: PASS"
          echo "Grid DPA Handbook: PASS"
          echo "Root cockpit: PASS"
          echo "Grid cockpit references: PASS"
          echo "Safety boundary: PASS"
          echo "Golden Rule: PASS"
          echo "Obsolete generator check: PASS"
          echo "Protected foundation unchanged: PASS"
          echo ""
          echo "Research mode: LOCAL DETERMINISTIC"
          echo "Backend: FALSE"
          echo "External connection: FALSE"
          echo "Physical execution: FALSE"
          echo "Autonomous actuation: FALSE"
          echo "Human decision authority: REQUIRED"
          echo ""
          echo "SRPC FACTORY VALIDATION: PASS"