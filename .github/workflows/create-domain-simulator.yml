name: Create SRPC Technology Domain Simulator

on:
  workflow_dispatch:
    inputs:

      domain_name:
        description: "Technology or company domain name"
        required: true
        type: string

      domain_id:
        description: "Domain ID using lowercase letters, numbers and hyphens"
        required: true
        type: string

      confirm_create:
        description: "Manual lever — confirm domain creation"
        required: true
        default: false
        type: boolean


jobs:

  create-domain:

    if: ${{ inputs.confirm_create == true }}

    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VERIFY PROTECTED SRPC FOUNDATION
      # ============================================================

      - name: Verify protected SRPC foundation
        shell: bash
        run: |

          set -e

          echo "Checking protected SRPC foundation..."

          for FILE in \
            research/srpc/srpcKernel.js \
            research/srpc/srpcRules.js \
            research/srpc/srpcCompute.js \
            research/srpc/srpcTest.html
          do

            if [ ! -f "$FILE" ]; then

              echo "ERROR: Protected file missing:"
              echo "$FILE"

              exit 1

            fi

            echo "FOUND: $FILE"

          done

          echo ""
          echo "Protected SRPC foundation verified."


      # ============================================================
      # 3. VALIDATE DOMAIN ID
      # ============================================================

      - name: Validate domain ID
        shell: bash
        run: |

          set -e

          DOMAIN_ID="${{ inputs.domain_id }}"

          if [[ ! "$DOMAIN_ID" =~ ^[a-z0-9-]+$ ]]; then

            echo "ERROR: Invalid domain ID."

            echo ""
            echo "Use lowercase letters,"
            echo "numbers and hyphens only."

            exit 1

          fi

          echo "Domain ID validated:"
          echo "$DOMAIN_ID"


      # ============================================================
      # 4. DEFINE DOMAIN PATH
      # ============================================================

      - name: Define domain path
        shell: bash
        run: |

          set -e

          DOMAIN_ID="${{ inputs.domain_id }}"

          DOMAIN_DIR="research/srpc/${DOMAIN_ID}"

          echo "DOMAIN_ID=$DOMAIN_ID" >> "$GITHUB_ENV"
          echo "DOMAIN_DIR=$DOMAIN_DIR" >> "$GITHUB_ENV"

          echo "Domain directory:"
          echo "$DOMAIN_DIR"


      # ============================================================
      # 5. CHECK DOMAIN DOES NOT ALREADY EXIST
      # ============================================================

      - name: Check domain availability
        shell: bash
        run: |

          set -e

          if [ -d "$DOMAIN_DIR" ]; then

            echo "ERROR: Domain already exists:"
            echo "$DOMAIN_DIR"

            exit 1

          fi

          echo "Domain available."


      # ============================================================
      # 6. VERIFY COMPLETE 11-FILE DOMAIN TEMPLATE
      # ============================================================

      - name: Verify complete domain template
        shell: bash
        run: |

          set -e

          TEMPLATE_DIR="research/srpc/domain"

          echo "Checking canonical SRPC domain template..."

          for FILE in \
            ScenarioData.js \
            Rules.js \
            ScenarioRules.js \
            RuleEngine.js \
            Scenario.js \
            ScenarioRuleEngine.js \
            ScenarioEngine.js \
            ScenarioCompute.js \
            DomainIntegration.js \
            Module.js \
            ScenarioTest.html
          do

            if [ ! -f "$TEMPLATE_DIR/$FILE" ]; then

              echo "ERROR: Required template file missing:"
              echo "$TEMPLATE_DIR/$FILE"

              exit 1

            fi

            echo "FOUND: $TEMPLATE_DIR/$FILE"

          done

          echo ""
          echo "Complete 11-file domain template verified."


      # ============================================================
      # 7. CREATE DOMAIN DIRECTORY
      # ============================================================

      - name: Create domain directory
        shell: bash
        run: |

          set -e

          mkdir -p "$DOMAIN_DIR"

          echo "Created:"
          echo "$DOMAIN_DIR"


      # ============================================================
      # 8. COPY COMPLETE DOMAIN ARCHITECTURE
      # ============================================================

      - name: Copy complete domain architecture
        shell: bash
        run: |

          set -e

          TEMPLATE_DIR="research/srpc/domain"

          cp "$TEMPLATE_DIR/ScenarioData.js" \
             "$DOMAIN_DIR/ScenarioData.js"

          cp "$TEMPLATE_DIR/Rules.js" \
             "$DOMAIN_DIR/Rules.js"

          cp "$TEMPLATE_DIR/ScenarioRules.js" \
             "$DOMAIN_DIR/ScenarioRules.js"

          cp "$TEMPLATE_DIR/RuleEngine.js" \
             "$DOMAIN_DIR/RuleEngine.js"

          cp "$TEMPLATE_DIR/Scenario.js" \
             "$DOMAIN_DIR/Scenario.js"

          cp "$TEMPLATE_DIR/ScenarioRuleEngine.js" \
             "$DOMAIN_DIR/ScenarioRuleEngine.js"

          cp "$TEMPLATE_DIR/ScenarioEngine.js" \
             "$DOMAIN_DIR/ScenarioEngine.js"

          cp "$TEMPLATE_DIR/ScenarioCompute.js" \
             "$DOMAIN_DIR/ScenarioCompute.js"

          cp "$TEMPLATE_DIR/DomainIntegration.js" \
             "$DOMAIN_DIR/DomainIntegration.js"

          cp "$TEMPLATE_DIR/Module.js" \
             "$DOMAIN_DIR/Module.js"

          cp "$TEMPLATE_DIR/ScenarioTest.html" \
             "$DOMAIN_DIR/ScenarioTest.html"

          echo "Complete domain architecture copied."


      # ============================================================
      # 9. APPLY DOMAIN IDENTITY
      # ============================================================

      - name: Apply domain identity
        shell: bash
        run: |

          set -e

          DOMAIN_NAME="${{ inputs.domain_name }}"
          DOMAIN_ID="${{ inputs.domain_id }}"

          echo "Applying domain identity..."

          if [ -f "$DOMAIN_DIR/ScenarioData.js" ]; then

            sed -i \
              "s/domainName: \"[^\"]*\"/domainName: \"$DOMAIN_NAME\"/" \
              "$DOMAIN_DIR/ScenarioData.js"

            sed -i \
              "s/domainId: \"[^\"]*\"/domainId: \"$DOMAIN_ID\"/" \
              "$DOMAIN_DIR/ScenarioData.js"

          fi


          if [ -f "$DOMAIN_DIR/ScenarioRules.js" ]; then

            sed -i \
              "s/domainName: \"[^\"]*\"/domainName: \"$DOMAIN_NAME\"/" \
              "$DOMAIN_DIR/ScenarioRules.js"

          fi


          if [ -f "$DOMAIN_DIR/ScenarioTest.html" ]; then

            sed -i \
              "s/SRPC Domain Test — [^<]*/SRPC Domain Test — $DOMAIN_NAME/" \
              "$DOMAIN_DIR/ScenarioTest.html"

            sed -i \
              "s/<h2>[^<]*<\/h2>/<h2>$DOMAIN_NAME<\/h2>/" \
              "$DOMAIN_DIR/ScenarioTest.html"

          fi

          echo "Domain identity applied."


      # ============================================================
      # 10. VERIFY GENERATED FILE SET
      # ============================================================

      - name: Verify generated domain files
        shell: bash
        run: |

          set -e

          echo "Verifying generated domain..."

          EXPECTED_FILES=(
            "ScenarioData.js"
            "Rules.js"
            "ScenarioRules.js"
            "RuleEngine.js"
            "Scenario.js"
            "ScenarioRuleEngine.js"
            "ScenarioEngine.js"
            "ScenarioCompute.js"
            "DomainIntegration.js"
            "Module.js"
            "ScenarioTest.html"
          )

          for FILE in "${EXPECTED_FILES[@]}"; do

            if [ ! -f "$DOMAIN_DIR/$FILE" ]; then

              echo "ERROR: Missing generated file:"
              echo "$DOMAIN_DIR/$FILE"

              exit 1

            fi

            echo "VERIFIED: $DOMAIN_DIR/$FILE"

          done

          echo ""
          echo "All 11 domain files verified."


      # ============================================================
      # 11. VERIFY NO EXTRA DOMAIN FILES
      # ============================================================

      - name: Verify domain file count
        shell: bash
        run: |

          set -e

          FILE_COUNT=$(
            find "$DOMAIN_DIR" \
              -maxdepth 1 \
              -type f \
              | wc -l
          )

          echo "Generated domain file count:"
          echo "$FILE_COUNT"

          if [ "$FILE_COUNT" -ne 11 ]; then

            echo "ERROR: Expected exactly 11 domain files."

            exit 1

          fi

          echo "Domain file count verified."


      # ============================================================
      # 12. VERIFY PROTECTED FOUNDATION
      # ============================================================

      - name: Verify protected foundation unchanged
        shell: bash
        run: |

          set -e

          echo "Checking protected SRPC foundation..."

          git diff --exit-code -- \
            research/srpc/srpcKernel.js \
            research/srpc/srpcRules.js \
            research/srpc/srpcCompute.js \
            research/srpc/srpcTest.html

          echo ""
          echo "Protected SRPC foundation unchanged."


      # ============================================================
      # 13. VERIFY CHANGE SCOPE
      # ============================================================

      - name: Verify change scope
        shell: bash
        run: |

          set -e

          echo "Checking generated change scope..."

          CHANGED_FILES=$(
            git status \
              --short
          )

          echo "$CHANGED_FILES"

          if git status --short | \
             grep -E \
             'research/srpc/(srpcKernel|srpcRules|srpcCompute|srpcTest)\.(js|html)'
          then

            echo ""
            echo "ERROR: Protected SRPC foundation changed."

            exit 1

          fi

          echo ""
          echo "Protected change boundary verified."


      # ============================================================
      # 14. CREATE FACTORY BRANCH
      # ============================================================

      - name: Create factory branch
        shell: bash
        run: |

          set -e

          BRANCH="factory/${{ inputs.domain_id }}"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          echo "Factory branch:"
          echo "$BRANCH"


      # ============================================================
      # 15. COMMIT DOMAIN
      # ============================================================

      - name: Commit generated domain
        shell: bash
        run: |

          set -e

          git add \
            "$DOMAIN_DIR"

          git commit \
            -m "Factory: create SRPC domain ${{ inputs.domain_id }}"

          echo "Domain committed."


      # ============================================================
      # 16. PUSH FACTORY BRANCH
      # ============================================================

      - name: Push factory branch
        shell: bash
        run: |

          set -e

          BRANCH="factory/${{ inputs.domain_id }}"

          git push \
            origin \
            "$BRANCH"

          echo ""
          echo "=============================================="
          echo "SRPC TECHNOLOGY DOMAIN CREATED"
          echo "=============================================="
          echo ""
          echo "Domain:"
          echo "${{ inputs.domain_name }}"
          echo ""
          echo "Domain ID:"
          echo "${{ inputs.domain_id }}"
          echo ""
          echo "Branch:"
          echo "$BRANCH"
          echo ""
          echo "Architecture:"
          echo "11 domain files"
          echo "+ 4 protected SRPC foundation files"
          echo "= 15 core SRPC architecture files"
          echo ""
          echo "Main cockpit:"
          echo "index.html"
          echo ""
          echo "Safety:"
          echo "LOCAL DETERMINISTIC SIMULATION"
          echo "HUMAN AUTHORITY REQUIRED"
          echo "PHYSICAL EXECUTION DISABLED"
          echo "AUTONOMOUS ACTUATION DISABLED"
          echo ""
          echo "=============================================="