<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sextant Protocol™ — SRPC Technology Domain Simulator Factory</title>

  <style>
    :root {
      --bg: #07111f;
      --panel: #0d1b2a;
      --panel-2: #102338;
      --border: #27435e;
      --text: #e8f1f8;
      --muted: #9fb3c8;
      --accent: #58b7ff;
      --good: #54d18a;
      --warn: #f4c95d;
      --danger: #ff6b6b;
      --shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 24px 18px;
      background: linear-gradient(180deg, #102b45, #07111f);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    section {
      margin-bottom: 18px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 19px;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .status-card {
      padding: 13px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .value {
      margin-top: 5px;
      font-weight: bold;
      word-break: break-word;
    }

    .good {
      color: var(--good);
    }

    .warn {
      color: var(--warn);
    }

    .danger {
      color: var(--danger);
    }

    .flow {
      display: grid;
      gap: 10px;
    }

    .flow-step {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 13px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .flow-number {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #173653;
      color: var(--accent);
      font-weight: bold;
    }

    .flow-arrow {
      color: var(--muted);
      font-size: 12px;
    }

    .flow-description {
      color: var(--muted);
      font-size: 13px;
    }

    .golden-rule {
      padding: 16px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      text-align: center;
      font-weight: bold;
      letter-spacing: 0.04em;
      word-spacing: 5px;
    }

    .architecture {
      padding: 16px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      text-align: center;
      color: var(--accent);
      font-weight: bold;
      line-height: 2;
    }

    .output {
      min-height: 100px;
      padding: 14px;
      background: #06101b;
      border: 1px solid var(--border);
      border-radius: 9px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 12px;
    }

    button {
      border: 1px solid var(--border);
      background: #173653;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #204a70;
    }

    button:active {
      transform: translateY(1px);
    }

    .decision-authority {
      border-left: 4px solid var(--warn);
    }

    .safety {
      border-left: 4px solid var(--good);
    }

    .research {
      border-left: 4px solid var(--accent);
    }

    footer {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      main {
        padding: 10px;
      }

      section {
        padding: 14px;
      }

      .flow-step {
        grid-template-columns: 36px 1fr;
      }

      .flow-arrow {
        grid-column: 2;
      }

      header h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Sextant Protocol™ — SRPC</h1>
  <p>
    Technology Domain Simulator Factory — deterministic local research cockpit,
    human-authorized, auditable and safety-bounded.
  </p>
</header>

<main>

  <!-- FACTORY STATUS -->
  <section>
    <h2>Factory Status</h2>

    <div class="status-grid">
      <div class="status-card">
        <div class="label">Domain</div>
        <div id="domainStatus" class="value warn">DOMAIN DATA UNAVAILABLE</div>
      </div>

      <div class="status-card">
        <div class="label">Architecture</div>
        <div class="value">SRPC Technology Domain</div>
      </div>

      <div class="status-card">
        <div class="label">Processing Mode</div>
        <div class="value good">LOCAL DETERMINISTIC RESEARCH</div>
      </div>
    </div>
  </section>

  <!-- SAFETY -->
  <section class="safety">
    <h2>Safety Boundary</h2>

    <div class="status-grid">
      <div class="status-card">
        <div class="label">Backend</div>
        <div class="value good">DISABLED</div>
      </div>

      <div class="status-card">
        <div class="label">External Connection</div>
        <div class="value good">DISABLED</div>
      </div>

      <div class="status-card">
        <div class="label">Physical Execution</div>
        <div class="value good">DISABLED</div>
      </div>

      <div class="status-card">
        <div class="label">Autonomous Actuation</div>
        <div class="value good">DISABLED</div>
      </div>
    </div>
  </section>

  <!-- TECHNOLOGY DOMAIN -->
  <section>
    <h2>Technology Domain</h2>

    <div class="status-grid">
      <div class="status-card">
        <div class="label">Domain Name</div>
        <div id="domainName" class="value warn">DOMAIN DATA UNAVAILABLE</div>
      </div>

      <div class="status-card">
        <div class="label">Domain ID</div>
        <div id="domainId" class="value">Not loaded</div>
      </div>

      <div class="status-card">
        <div class="label">Source</div>
        <div class="value">LOCAL_SIMULATION</div>
      </div>

      <div class="status-card">
        <div class="label">Purpose</div>
        <div class="value">SRPC_TECHNOLOGY_DOMAIN_RESEARCH</div>
      </div>
    </div>
  </section>

  <!-- SRPC ARCHITECTURE -->
  <section>
    <h2>SRPC Processing Architecture</h2>

    <div class="architecture">
      ENVIRONMENT
      →
      AVAILABLE INPUTS
      →
      DATA
      →
      PRIMARY AI
      →
      SECONDARY AI
      →
      STABILIZER
      →
      CAPTAIN AI LENA
      →
      HUMAN DECISION AUTHORITY
      →
      SIMULATED ACTION
      →
      AUDIT / UPDATE
    </div>
  </section>

  <!-- GOLDEN RULE -->
  <section>
    <h2>Golden Rule Lifecycle</h2>

    <div class="golden-rule">
      OBSERVE → VERIFY → ASSESS → DECIDE → ACT → UPDATE
    </div>
  </section>

  <!-- SRPC TEST FLOW -->
  <section>
    <h2>SRPC Test Flow</h2>

    <div class="subtitle">
      The cockpit displays the complete SRPC research test sequence.
      Processing remains inside the existing SRPC architecture.
    </div>

    <div class="flow">

      <div class="flow-step">
        <div class="flow-number">1</div>
        <div>
          <h3>LOAD</h3>
          <div class="flow-description">
            Load protected SRPC foundation and technology-domain architecture.
          </div>
        </div>
        <div id="flowLoad" class="flow-arrow">WAITING</div>
      </div>

      <div class="flow-step">
        <div class="flow-number">2</div>
        <div>
          <h3>OBSERVE</h3>
          <div class="flow-description">
            Environment, available inputs and current system state.
          </div>
        </div>
        <div id="flowObserve" class="flow-arrow">WAITING</div>
      </div>

      <div class="flow-step">
        <div class="flow-number">3</div>
        <div>
          <h3>VERIFY</h3>
          <div class="flow-description">
            Validate data, rules and architecture dependencies.
          </div>
        </div>
        <div id="flowVerify" class="flow-arrow">WAITING</div>
      </div>

      <div class="flow-step">
        <div class="flow-number">4</div>
        <div>
          <h3>ASSESS</h3>
          <div class="flow-description">
            Primary AI → Secondary AI → Stabilizer → Rule Engine.
          </div>
        </div>
        <div id="flowAssess" class="flow-arrow">WAITING</div>
      </div>

      <div class="flow-step">
        <div class="flow-number">5</div>
        <div>
          <h3>CAPTAIN AI LENA</h3>
          <div class="flow-description">
            Decision-support correlation, resilience assessment and recommendation.
          </div>
        </div>
        <div id="flowLena" class="flow-arrow">WAITING</div>
      </div>

      <div class="flow-step">
        <div class="flow-number">6</div>
        <div>
          <h3>HUMAN DECISION AUTHORITY</h3>
          <div class="flow-description">
            Human authority reviews and determines the simulated disposition.
          </div>
        </div>
        <div id="flowHuman" class="flow-arrow">REQUIRED</div>
      </div>

      <div class="flow-step">
        <div class="flow-number">7</div>
        <div>
          <h3>ACT — SIMULATED ONLY</h3>
          <div class="flow-description">
            No physical execution and no autonomous actuation.
          </div>
        </div>
        <div id="flowAct" class="flow-arrow">SIMULATED</div>
      </div>

      <div class="flow-step">
        <div class="flow-number">8</div>
        <div>
          <h3>UPDATE</h3>
          <div class="flow-description">
            Audit record, state update and deterministic re-test.
          </div>
        </div>
        <div id="flowUpdate" class="flow-arrow">WAITING</div>
      </div>

    </div>
  </section>

  <!-- SYSTEM STATE -->
  <section>
    <h2>System State</h2>
    <div id="systemState" class="output">Not loaded.</div>
  </section>

  <!-- DOMAIN INTEGRATION -->
  <section>
    <h2>Domain Integration</h2>

    <div id="integrationStatus" class="output">
      Waiting for DomainIntegration.js.
    </div>

    <div class="buttons">
      <button id="refreshButton">Refresh Status</button>
    </div>
  </section>

  <!-- SCENARIO PROCESSING -->
  <section>
    <h2>SRPC Scenario Processing</h2>

    <div class="subtitle">
      This cockpit requests processing from the existing domain architecture.
      It does not contain or replace domain rules, algorithms or protected SRPC
      compute logic.
    </div>

    <div class="buttons">
      <button id="runButton">Run Deterministic Scenario</button>
      <button id="determinismButton">Test Determinism</button>
    </div>

    <div id="scenarioOutput" class="output">
      Scenario not executed.
    </div>
  </section>

  <!-- CAPTAIN AI LENA -->
  <section>
    <h2>Captain AI Lena Decision-Support Layer</h2>

    <div class="subtitle">
      Captain AI Lena provides decision support only.
      Human Decision Authority remains final.
    </div>

    <div class="status-grid">
      <div class="status-card">
        <div class="label">AI Layer</div>
        <div class="value">CAPTAIN AI LENA</div>
      </div>

      <div class="status-card">
        <div class="label">Human Authority</div>
        <div class="value warn">REQUIRED</div>
      </div>
    </div>
  </section>

  <!-- HUMAN AUTHORITY -->
  <section class="decision-authority">
    <h2>Human Decision Authority</h2>

    <div class="subtitle">
      No simulated action may be treated as autonomous execution.
      The final decision belongs to the authorized human decision-maker.
    </div>

    <div class="buttons">
      <button data-decision="AUTHORIZE">AUTHORIZE</button>
      <button data-decision="MAINTAIN_SAFE_STATE">MAINTAIN SAFE STATE</button>
      <button data-decision="REQUEST_DIAGNOSTICS">REQUEST DIAGNOSTICS</button>
      <button data-decision="ABORT">ABORT</button>
      <button data-decision="ESCALATE">ESCALATE</button>
    </div>

    <div id="decisionOutput" class="output">
      No human decision recorded.
    </div>
  </section>

  <!-- AUDIT -->
  <section>
    <h2>Audit Record</h2>

    <div id="auditOutput" class="output">
      Waiting for scenario processing and human decision.
    </div>
  </section>

  <!-- GOVERNANCE -->
  <section class="research">
    <h2>Research Governance</h2>

    <div class="subtitle">
      <strong>LOCAL DETERMINISTIC SIMULATED RESEARCH</strong>
    </div>

    <div class="status-grid">
      <div class="status-card">
        <div class="label">Backend Connection</div>
        <div class="value good">NONE</div>
      </div>

      <div class="status-card">
        <div class="label">External Execution</div>
        <div class="value good">NONE</div>
      </div>

      <div class="status-card">
        <div class="label">Physical Execution</div>
        <div class="value good">NONE</div>
      </div>

      <div class="status-card">
        <div class="label">Autonomous Actuation</div>
        <div class="value good">NONE</div>
      </div>

      <div class="status-card">
        <div class="label">Human Authority</div>
        <div class="value warn">FINAL</div>
      </div>

      <div class="status-card">
        <div class="label">Protected Foundation</div>
        <div class="value good">AUTHORITATIVE</div>
      </div>
    </div>
  </section>

</main>

<footer>
  Sextant Protocol™ — SRPC Technology Domain Simulator Factory<br>
  Research architecture only. Deterministic local simulation.
  Human-authorized and auditable.
</footer>


<!-- ============================================================
     PROTECTED SRPC FOUNDATION
     ============================================================ -->

<script src="research/srpc/srpcKernel.js"></script>
<script src="research/srpc/srpcRules.js"></script>
<script src="research/srpc/srpcCompute.js"></script>


<!-- ============================================================
     SRPC TECHNOLOGY-DOMAIN ARCHITECTURE
     ============================================================ -->

<script src="research/srpc/domain/ScenarioData.js"></script>
<script src="research/srpc/domain/Rules.js"></script>
<script src="research/srpc/domain/ScenarioRules.js"></script>
<script src="research/srpc/domain/RuleEngine.js"></script>
<script src="research/srpc/domain/Scenario.js"></script>
<script src="research/srpc/domain/ScenarioRuleEngine.js"></script>
<script src="research/srpc/domain/ScenarioEngine.js"></script>
<script src="research/srpc/domain/ScenarioCompute.js"></script>
<script src="research/srpc/domain/DomainIntegration.js"></script>
<script src="research/srpc/domain/Module.js"></script>


<script>
(function () {

  "use strict";

  var lastResult = null;
  var lastDecision = null;
  var auditRecord = null;

  function byId(id) {
    return document.getElementById(id);
  }

  function safeString(value) {
    try {
      if (typeof value === "string") {
        return value;
      }

      return JSON.stringify(value, null, 2);
    } catch (error) {
      return String(value);
    }
  }

  function setFlow(id, value, className) {
    var element = byId(id);

    if (!element) {
      return;
    }

    element.textContent = value;

    element.className = "flow-arrow";

    if (className) {
      element.classList.add(className);
    }
  }

  function markInitialLoad() {
    setFlow("flowLoad", "LOADED", "good");

    setFlow(
      "flowHuman",
      "REQUIRED",
      "warn"
    );

    setFlow(
      "flowAct",
      "SIMULATED ONLY",
      "good"
    );
  }

  function getScenarioData() {
    return window.SRPCScenarioData || null;
  }

  function getDomainIntegration() {
    return window.SextantDomainIntegration || null;
  }

  function getScenarioEngine() {
    return window.SextantScenarioEngine || null;
  }

  function getScenarioCompute() {
    return window.SextantScenarioCompute || null;
  }

  function updateDomainInformation() {

    var data = getScenarioData();

    if (!data) {
      byId("domainStatus").textContent =
        "DOMAIN DATA UNAVAILABLE";

      byId("domainName").textContent =
        "DOMAIN DATA UNAVAILABLE";

      byId("domainId").textContent =
        "Not loaded";

      return;
    }

    var domainName =
      data.domainName ||
      data.name ||
      data.DOMAIN_NAME ||
      "Technology Domain";

    var domainId =
      data.domainId ||
      data.id ||
      data.DOMAIN_ID ||
      "Not loaded";

    byId("domainStatus").textContent = "AVAILABLE";
    byId("domainStatus").className = "value good";

    byId("domainName").textContent = domainName;
    byId("domainId").textContent = domainId;
  }

  function updateSystemState() {

    var data = getScenarioData();

    if (!data) {
      byId("systemState").textContent =
        "System state unavailable.";
      return;
    }

    var state =
      data.systemState ||
      data.currentSystemState ||
      data.state ||
      null;

    if (!state) {
      byId("systemState").textContent =
        "System state not explicitly exposed by ScenarioData.";
      return;
    }

    byId("systemState").textContent =
      safeString(state);
  }

  function refreshStatus() {

    var integration = getDomainIntegration();

    if (!integration) {

      byId("integrationStatus").textContent =
        "DomainIntegration.js is not exposing SextantDomainIntegration.";

      return;
    }

    try {

      var status =
        typeof integration.getStatus === "function"
          ? integration.getStatus()
          : {
              available: true,
              message: "DomainIntegration loaded."
            };

      byId("integrationStatus").textContent =
        safeString(status);

    } catch (error) {

      byId("integrationStatus").textContent =
        "DomainIntegration error:\n" +
        error.message;
    }
  }

  function executeScenario() {

    var integration = getDomainIntegration();
    var compute = getScenarioCompute();

    byId("scenarioOutput").textContent =
      "Processing deterministic scenario...";

    setFlow("flowObserve", "PROCESSING", "warn");
    setFlow("flowVerify", "PROCESSING", "warn");
    setFlow("flowAssess", "PROCESSING", "warn");
    setFlow("flowLena", "PROCESSING", "warn");

    var result = null;

    try {

      if (
        integration &&
        typeof integration.process === "function"
      ) {

        result = integration.process();

      } else if (
        compute &&
        typeof compute.execute === "function"
      ) {

        var data = getScenarioData();

        result = compute.execute({
          source: "LOCAL_SIMULATION",
          purpose: "SRPC_TECHNOLOGY_DOMAIN_RESEARCH",
          systemState:
            data && data.systemState
              ? data.systemState
              : {}
        });

      } else {

        throw new Error(
          "No compatible DomainIntegration or ScenarioCompute execution method was found."
        );
      }

      lastResult = result;

      setFlow("flowObserve", "PASS", "good");
      setFlow("flowVerify", "PASS", "good");
      setFlow("flowAssess", "PASS", "good");
      setFlow("flowLena", "DECISION SUPPORT", "good");
      setFlow("flowHuman", "AWAITING HUMAN", "warn");
      setFlow("flowAct", "SIMULATED ONLY", "good");
      setFlow("flowUpdate", "READY", "good");

      byId("scenarioOutput").textContent =
        safeString(result);

      createAudit("SCENARIO_PROCESSED", result);

    } catch (error) {

      setFlow("flowObserve", "ERROR", "danger");
      setFlow("flowVerify", "NOT REACHED", "danger");
      setFlow("flowAssess", "NOT REACHED", "danger");
      setFlow("flowLena", "NOT REACHED", "danger");
      setFlow("flowUpdate", "NOT REACHED", "danger");

      byId("scenarioOutput").textContent =
        "Scenario processing error:\n" +
        error.message;

      createAudit(
        "SCENARIO_ERROR",
        {
          message: error.message
        }
      );
    }
  }

  function testDeterminism() {

    var integration = getDomainIntegration();
    var compute = getScenarioCompute();

    byId("scenarioOutput").textContent =
      "Running determinism test...";

    try {

      var result;

      if (
        integration &&
        typeof integration.testDeterminism === "function"
      ) {

        result = integration.testDeterminism();

      } else if (
        compute &&
        typeof compute.testDeterminism === "function"
      ) {

        result = compute.testDeterminism();

      } else {

        throw new Error(
          "No compatible determinism test method was found."
        );
      }

      byId("scenarioOutput").textContent =
        "DETERMINISM TEST RESULT\n\n" +
        safeString(result);

      setFlow("flowUpdate", "DETERMINISM TESTED", "good");

      createAudit(
        "DETERMINISM_TEST",
        result
      );

    } catch (error) {

      byId("scenarioOutput").textContent =
        "Determinism test error:\n" +
        error.message;

      createAudit(
        "DETERMINISM_ERROR",
        {
          message: error.message
        }
      );
    }
  }

  function recordHumanDecision(decision) {

    lastDecision = decision;

    byId("decisionOutput").textContent =
      "HUMAN DECISION RECORDED\n\n" +
      decision +
      "\n\n" +
      "Recorded for deterministic research audit only.\n" +
      "No physical or autonomous action was executed.";

    setFlow(
      "flowHuman",
      "DECISION RECORDED",
      "good"
    );

    setFlow(
      "flowAct",
      "SIMULATED ONLY",
      "good"
    );

    setFlow(
      "flowUpdate",
      "AUDIT UPDATED",
      "good"
    );

    createAudit(
      "HUMAN_DECISION",
      {
        decision: decision,
        authority: "HUMAN_DECISION_AUTHORITY",
        physicalExecution: false,
        autonomousActuation: false
      }
    );
  }

  function createAudit(eventType, payload) {

    auditRecord = {
      event: eventType,
      timestamp: "LOCAL_SIMULATION",
      humanAuthorizationRequired: true,
      backend: false,
      externalConnection: false,
      physicalExecution: false,
      autonomousActuation: false,
      payload: payload
    };

    byId("auditOutput").textContent =
      safeString(auditRecord);
  }

  function initialize() {

    markInitialLoad();
    updateDomainInformation();
    updateSystemState();
    refreshStatus();

    var integration = getDomainIntegration();

    if (integration) {

      byId("integrationStatus").className =
        "output";

    } else {

      byId("integrationStatus").textContent =
        "Waiting for DomainIntegration.js.";
    }
  }

  byId("refreshButton")
    .addEventListener(
      "click",
      refreshStatus
    );

  byId("runButton")
    .addEventListener(
      "click",
      executeScenario
    );

  byId("determinismButton")
    .addEventListener(
      "click",
      testDeterminism
    );

  document
    .querySelectorAll("[data-decision]")
    .forEach(function (button) {

      button.addEventListener(
        "click",
        function () {

          recordHumanDecision(
            button.getAttribute("data-decision")
          );

        }
      );

    });

  initialize();

})();
</script>

</body>
</html>