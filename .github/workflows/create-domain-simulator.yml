name: Sextant Protocol Founder Simulator Validation

"on":
  workflow_dispatch:
  push:
    branches:
      - domain/grid-module-dpa
    paths:
      - index.html
      - research/srpc/**
      - .github/workflows/create-domain-simulator.yml

permissions:
  contents: read

jobs:
  validate-founder-simulator:
    name: Validate Founder Simulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify protected SRPC foundation
        shell: bash
        run: |
          set -e

          echo "Checking protected SRPC foundation..."

          for FILE in \
            research/srpc/srpcKernel.js \
            research/srpc/srpcRules.js \
            research/srpc/srpcCompute.js \
            research/srpc/srpcTest.html
          do
            test -f "$FILE"
            echo "FOUND: $FILE"
          done

          echo "Protected SRPC foundation: PASS"

      - name: Verify Grid Module architecture
        shell: bash
        run: |
          set -e

          echo "Checking Grid Technology Domain..."

          for FILE in \
            research/srpc/domain/grid/ScenarioData.js \
            research/srpc/domain/grid/Rules.js \
            research/srpc/domain/grid/ScenarioRules.js \
            research/srpc/domain/grid/RuleEngine.js \
            research/srpc/domain/grid/Scenario.js \
            research/srpc/domain/grid/ScenarioRuleEngine.js \
            research/srpc/domain/grid/ScenarioEngine.js \
            research/srpc/domain/grid/ScenarioCompute.js \
            research/srpc/domain/grid/DomainIntegration.js \
            research/srpc/domain/grid/Module.js \
            research/srpc/domain/grid/GridSimulatorUI.js \
            research/srpc/domain/grid/ScenarioTest.html
          do
            test -f "$FILE"
            echo "FOUND: $FILE"
          done

          echo "Grid Module architecture: PASS"

      - name: Verify Founder Simulator identity
        shell: bash
        run: |
          set -e

          test -f index.html

          grep -q "Sextant Protocol" index.html
          grep -q "Founder Simulator" index.html
          grep -q "Grid" index.html

          echo "Founder Simulator identity: PASS"

      - name: Verify protected SRPC references
        shell: bash
        run: |
          set -e

          grep -q "research/srpc/srpcKernel.js" index.html
          grep -q "research/srpc/srpcRules.js" index.html
          grep -q "research/srpc/srpcCompute.js" index.html

          echo "Protected SRPC references: PASS"

      - name: Verify Grid wiring references
        shell: bash
        run: |
          set -e

          for FILE in \
            ScenarioData.js \
            Rules.js \
            ScenarioRules.js \
            RuleEngine.js \
            Scenario.js \
            ScenarioRuleEngine.js \
            ScenarioEngine.js \
            ScenarioCompute.js \
            DomainIntegration.js \
            Module.js \
            GridSimulatorUI.js
          do
            grep -q "research/srpc/domain/grid/$FILE" index.html
            echo "WIRED: $FILE"
          done

          echo "Grid cockpit wiring references: PASS"

      - name: Verify Grid ScenarioTest wiring
        shell: bash
        run: |
          set -e

          SCENARIO_TEST="research/srpc/domain/grid/ScenarioTest.html"

          test -f "$SCENARIO_TEST"

          grep -q "ScenarioData.js" "$SCENARIO_TEST"
          grep -q "Rules.js" "$SCENARIO_TEST"
          grep -q "ScenarioRules.js" "$SCENARIO_TEST"
          grep -q "RuleEngine.js" "$SCENARIO_TEST"
          grep -q "Scenario.js" "$SCENARIO_TEST"
          grep -q "ScenarioRuleEngine.js" "$SCENARIO_TEST"
          grep -q "ScenarioEngine.js" "$SCENARIO_TEST"
          grep -q "ScenarioCompute.js" "$SCENARIO_TEST"
          grep -q "DomainIntegration.js" "$SCENARIO_TEST"
          grep -q "Module.js" "$SCENARIO_TEST"
          grep -q "GridSimulatorUI.js" "$SCENARIO_TEST"

          echo "Grid ScenarioTest wiring: PASS"

      - name: Verify Grid identity
        shell: bash
        run: |
          set -e

          grep -q "SextantGridScenarioData" \
            research/srpc/domain/grid/ScenarioData.js

          grep -q "SextantGridScenario" \
            research/srpc/domain/grid/Scenario.js

          grep -q "SextantGridScenarioEngine" \
            research/srpc/domain/grid/ScenarioEngine.js

          grep -q "SextantGridScenarioCompute" \
            research/srpc/domain/grid/ScenarioCompute.js

          grep -q "SextantGridDomainIntegration" \
            research/srpc/domain/grid/DomainIntegration.js

          grep -q "SextantGridModule" \
            research/srpc/domain/grid/Module.js

          grep -q "SextantGridSimulatorUI" \
            research/srpc/domain/grid/GridSimulatorUI.js

          echo "Grid dedicated namespace architecture: PASS"

      - name: Verify safety boundary
        shell: bash
        run: |
          set -e

          grep -q "Backend connection: FALSE" index.html
          grep -q "External connection: FALSE" index.html
          grep -q "Physical execution: FALSE" index.html
          grep -q "Autonomous actuation: FALSE" index.html
          grep -q "Human authorization required: TRUE" index.html

          echo "Safety boundary: PASS"

      - name: Verify Golden Rule
        shell: bash
        run: |
          set -e

          grep -q \
            "OBSERVE → VERIFY → ASSESS → DECIDE → ACT → UPDATE" \
            index.html

          echo "Golden Rule: PASS"

      - name: Verify research safety statements
        shell: bash
        run: |
          set -e

          grep -q "physical_execution: false" \
            research/srpc/domain/grid/GridSimulatorUI.js || true

          grep -q "autonomous_actuation: false" \
            research/srpc/domain/grid/GridSimulatorUI.js || true

          echo "Research safety statements checked."

      - name: Validation summary
        shell: bash
        run: |
          echo "=============================================="
          echo "Sextant Protocol™ Founder Simulator"
          echo "Grid Technology Domain"
          echo "=============================================="
          echo "Protected SRPC foundation: PASS"
          echo "Grid Module architecture: PASS"
          echo "Founder Simulator identity: PASS"
          echo "Protected SRPC references: PASS"
          echo "Grid cockpit wiring: PASS"
          echo "Grid ScenarioTest wiring: PASS"
          echo "Grid namespace architecture: PASS"
          echo "Safety boundary: PASS"
          echo "Golden Rule: PASS"
          echo "=============================================="
          echo "LOCAL DETERMINISTIC RESEARCH ONLY"
          echo "BACKEND: FALSE"
          echo "EXTERNAL CONNECTION: FALSE"
          echo "PHYSICAL EXECUTION: FALSE"
          echo "AUTONOMOUS ACTUATION: FALSE"
          echo "HUMAN DECISION AUTHORITY: REQUIRED"
          echo "=============================================="
          echo "FOUNDER SIMULATOR VALIDATION: PASS"
          echo "=============================================="