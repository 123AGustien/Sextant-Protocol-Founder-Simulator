<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sextant Protocol™ — Domain Scenario Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.5;
        }

        h1 {
            margin-bottom: 5px;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #999;
        }

        .pass {
            font-weight: bold;
        }

        .fail {
            font-weight: bold;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

<h1>Sextant Protocol™</h1>

<h2>SRPC Technology Domain Scenario Test</h2>

<div id="status" class="status">
    TESTING...
</div>

<pre id="output"></pre>

<script src="../srpcKernel.js"></script>
<script src="../srpcRules.js"></script>
<script src="../srpcCompute.js"></script>

<script src="ScenarioData.js"></script>
<script src="Rules.js"></script>
<script src="ScenarioCompute.js"></script>

<script>
(function () {

    "use strict";

    const output = document.getElementById("output");
    const status = document.getElementById("status");

    const results = [];

    function record(name, passed, details) {

        results.push({
            name: name,
            passed: passed,
            details: details || null
        });
    }

    function writeOutput(data) {

        output.textContent =
            JSON.stringify(data, null, 2);
    }

    try {

        /*
         * --------------------------------------------------
         * 1. Component Availability
         * --------------------------------------------------
         */

        const componentsAvailable =
            typeof window.SRPCKernel !== "undefined" &&
            typeof window.SRPCRules !== "undefined" &&
            typeof window.SRPCCompute !== "undefined" &&
            typeof window.SextantScenarioData !== "undefined" &&
            typeof window.SextantDomainRules !== "undefined" &&
            typeof window.SextantScenarioCompute !== "undefined";

        record(
            "DOMAIN_COMPONENTS_AVAILABLE",
            componentsAvailable
        );

        if (!componentsAvailable) {
            throw new Error(
                "One or more required components are unavailable."
            );
        }

        /*
         * --------------------------------------------------
         * 2. Scenario Data Validation
         * --------------------------------------------------
         */

        const dataValidation =
            window.SextantScenarioData.validate();

        record(
            "SCENARIO_DATA_VALIDATION",
            dataValidation.valid,
            dataValidation
        );

        /*
         * --------------------------------------------------
         * 3. Dependency Validation
         * --------------------------------------------------
         */

        const dependencyValidation =
            window.SextantScenarioCompute
                .validateDependencies();

        record(
            "DOMAIN_DEPENDENCIES",
            dependencyValidation.valid,
            dependencyValidation
        );

        /*
         * --------------------------------------------------
         * 4. Retrieve Scenario Inputs
         * --------------------------------------------------
         */

        const inputs =
            window.SextantScenarioData.getInputs();

        const ruleInputs = {
            availability:
                inputs.systemState.availability,

            integrity:
                inputs.systemState.integrity,

            stability:
                inputs.systemState.stability,

            humanAuthorizationRequired:
                window.SextantScenarioData
                    .safety
                    .humanAuthorizationRequired
        };

        /*
         * --------------------------------------------------
         * 5. Rule Evaluation
         * --------------------------------------------------
         */

        const ruleResults =
            window.SextantDomainRules
                .evaluateAll(ruleInputs);

        const ruleAssessment =
            window.SextantDomainRules
                .assess(ruleResults);

        record(
            "DOMAIN_RULE_EVALUATION",
            ruleAssessment.allRulesPassed,
            {
                results: ruleResults,
                assessment: ruleAssessment
            }
        );

        /*
         * --------------------------------------------------
         * 6. Domain Compute
         * --------------------------------------------------
         */

        const computeResult =
            window.SextantScenarioCompute.execute(
                window.SextantScenarioData.getData(),
                ruleResults
            );

        record(
            "DOMAIN_COMPUTE",
            computeResult.assessment === "PASS",
            computeResult
        );

        /*
         * --------------------------------------------------
         * 7. Determinism
         * --------------------------------------------------
         */

        const determinism =
            window.SextantScenarioCompute
                .testDeterminism(
                    window.SextantScenarioData.getData(),
                    ruleResults
                );

        record(
            "DOMAIN_DETERMINISM",
            determinism.deterministic,
            determinism
        );

        /*
         * --------------------------------------------------
         * 8. Safety Boundary
         * --------------------------------------------------
         */

        const safety =
            computeResult.action.physicalExecution === false &&
            computeResult.action.autonomousActuation === false &&
            computeResult.action.authorizedByHuman === false &&
            computeResult.decisionSupport
                .humanAuthorizationRequired === true;

        record(
            "DOMAIN_SAFETY_BOUNDARY",
            safety,
            {
                physicalExecution:
                    computeResult.action.physicalExecution,

                autonomousActuation:
                    computeResult.action.autonomousActuation,

                authorizedByHuman:
                    computeResult.action.authorizedByHuman,

                humanAuthorizationRequired:
                    computeResult.decisionSupport
                        .humanAuthorizationRequired
            }
        );

        /*
         * --------------------------------------------------
         * 9. Final Result
         * --------------------------------------------------
         */

        const allPassed =
            results.every(function (result) {
                return result.passed === true;
            });

        const finalResult = {

            test: "SEXTANT_DOMAIN_SCENARIO_TEST",

            version: "0.1.0-RESEARCH",

            status:
                allPassed
                    ? "DOMAIN_SCENARIO_TEST_PASS"
                    : "DOMAIN_SCENARIO_TEST_FAIL",

            results: results,

            safety: {
                physicalExecution: false,
                autonomousActuation: false,
                humanAuthorizationRequired: true
            },

            decisionAuthority:
                "HUMAN_DECISION_AUTHORITY"
        };

        status.textContent =
            finalResult.status;

        status.className =
            allPassed
                ? "status pass"
                : "status fail";

        writeOutput(finalResult);

    } catch (error) {

        const failure = {

            test: "SEXTANT_DOMAIN_SCENARIO_TEST",

            status: "DOMAIN_SCENARIO_TEST_ERROR",

            error: error.message,

            physicalExecution: false,

            autonomousActuation: false,

            humanAuthorizationRequired: true,

            decisionAuthority:
                "HUMAN_DECISION_AUTHORITY"
        };

        status.textContent =
            "DOMAIN_SCENARIO_TEST_ERROR";

        status.className =
            "status fail";

        writeOutput(failure);
    }

})();
</script>

</body>
</html>
